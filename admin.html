<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Notícias</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #111; color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background: #222; padding: 25px; border-radius: 10px; border: 2px solid #fc0; }
        h1 { text-align: center; color: #fc0; margin-bottom: 25px; font-size: 20px; }
        .campo { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 15px; color: #ddd; }
        input, textarea { width: 100%; padding: 10px; border: none; border-radius: 5px; background: #333; color: white; font-size: 15px; }
        textarea { min-height: 100px; resize: vertical; }
        button { width: 100%; padding: 12px; background: #fc0; color: #111; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 18px; }
        button:hover { background: #e0c000; }
        .dica { font-size: 12px; color: #888; margin-top: 4px; }
        .aviso { background: #2a2a2a; padding: 12px; border-radius: 5px; margin-bottom: 20px; border-left: 3px solid #fc0; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Gerador de Notícias</h1>
    
    <div class="aviso">
        Preencha tudo → clique em "Gerar Código" → copie o código de baixo e cole em noticias.html
    </div>
    
    <div class="campo">
        <label>Título:</label>
        <input type="text" id="titulo">
    </div>
    
    <div class="campo">
        <label>Data:</label>
        <input type="text" id="data">
    </div>
    
    <div class="campo">
        <label>Link da imagem:</label>
        <input type="text" id="imagem">
        <p class="dica">Envie a foto no GitHub e cole o link aqui</p>
    </div>
    
    <div class="campo">
        <label>Conteúdo da notícia:</label>
        <textarea id="conteudo"></textarea>
    </div>
    
    <button onclick="gerar()">🔄 Gerar Código</button>
    
    <div class="campo">
        <label>📋 Código pronto — copie aqui:</label>
        <textarea id="codigo" readonly placeholder="Clique no botão acima..."></textarea>
    </div>
</div>

<script>
function gerar() {
    const titulo = document.getElementById('titulo').value || 'Sem Título';
    const data = document.getElementById('data').value || '';
    const imagem = document.getElementById('imagem').value.trim();
    const conteudo = document.getElementById('conteudo').value || '';
    
    let imgHtml = '';
    if (imagem !== '') {
        imgHtml = <img src="${imagem}" alt="${titulo}" style="max-width:100%; height:auto; border-radius:5px; margin-bottom:12px;">;
    }
    
    const resultado = `<div style="background:#222; padding:20px; margin-bottom:20px; border-radius:8px; border-left:4px solid #fc0;">
    ${imgHtml}
    <h3 style="color:#fc0; margin-bottom:5px;">${titulo}</h3>
    <small style="color:#888;">${data}</small>
    <p style="margin-top:10px; color:#eee; line-height:1.6;">${conteudo}</p>
</div>`;
    
    document.getElementById('codigo').value = resultado;
}
</script>

</body>
</html>
