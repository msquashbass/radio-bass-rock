<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Radio Bass Rock</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
.box{background:#111;padding:20px;border-radius:15px;max-width:600px;margin:0 auto}
img.logo{max-width:220px}
img.capa{max-width:100%;border-radius:12px;margin:15px 0}
#musica{background:#222;padding:12px;border-radius:10px;font-weight:bold;margin:10px 0}
button{background:#e60000;color:#fff;border:none;padding:18px 35px;font-size:22px;font-weight:bold;border-radius:50px;cursor:pointer}
audio{width:100%;margin-top:20px}
.social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.social a{color:#fff;padding:12px 20px;border-radius:50px;text-decoration:none;font-weight:bold}
.face{background:#1877F2}
.insta{background:#E1306C}
.whats{background:#25D366}
</style>
</head>
<body>
<div class="box">
<img class="logo" src="logo.png" alt="Bass Rock">
<img class="capa" src="capa.png" alt="Capa">
<h1>WEB RADIO BASS ROCK</h1>
<p>Rock de verdade, 24h no ar</p>

<div id="musica">🎵 Tocando agora: Carregando...</div>

<audio id="radio" controls preload="none" src="http://player.srvsh.com.br/player-barra/8158/000000" frameborder="0" width="100%" height="31""></audio>
<br><br>
<button onclick="document.getElementById('radio').play()">▶ OUVIR AGORA</button>

<div class="social">
<a class="face" href="https://www.facebook.com/webradiobass.com.br" target="_blank">Facebook</a>
<a class="insta" href="https://www.instagram.com/webradiobass.com.br" target="_blank">Instagram</a>
<a class="whats" href="https://wa.me/5584999999999" target="_blank">WhatsApp</a>
</div>

<br>
<p>Programação: Clássicos do Rock - 24h<br>Pede sua música no WhatsApp!</p>
</div>

<script>
async function agora(){
  try{
    let r = await fetch("http://player.srvsh.com.br/player-barra/8158/000000" frameborder="0" width="100%" height="31"');
    let t = await r.text();
    if(t) document.getElementById('musica').innerHTML = '🎵 Tocando agora: ' + t;
  }catch(e){}
}
agora();
setInterval(agora, 15000);
</script>
</body>
</html>
