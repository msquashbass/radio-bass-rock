<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 5 — Rádio Bass Rock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 2em;
            margin-bottom: 35px;
        }
        .faixa {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #ffd700;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .numero {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffd700;
            min-width: 35px;
        }
        .info {
            flex: 1;
            min-width: 200px;
        }
        .musica {
            font-weight: bold;
            font-size: 0.95em;
        }
        .artista {
            font-size: 0.85em;
            color: #aaa;
        }
        .mini-player {
            min-width: 140px;
        }
        .mini-player audio {
            width: 100%;
            height: 32px;
            border-radius: 4px;
        }
        .voltar {
            display: inline-block;
            margin-top: 40px;
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        .voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Top 5 Semanal</h1>

        <div class="faixa">
            <span class="numero">1º</span>
            <div class="info">
                <div class="musica">SILENCIO.mp3</div>
                <div class="artista">— U2</div>
            </div>
            <div class="mini-player">
                <audio controls preload="none">
                    <source src="U2 - SILENCIO.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                
            </div>
        </div>

        <div class="faixa">
            <span class="numero">2º</span>
            <div class="info">
                <div class="musica">YOU KNOW I'M NO GOOD</div>
                <div class="artista">— THE ROLLING STONES</div>
            </div>
            <div class="mini-player">
                <audio controls preload="none">
                    <source src="THE ROLLING STONES - YOU KNOW I'M NO GOOD.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                
            </div>
        </div>

        <div class="faixa">
            <span class="numero">3º</span>
            <div class="info">
                <div class="musica">BLACK STARS</div>
                <div class="artista">— THE SMASHING PUMPKINS</div>
            </div>
            <div class="mini-player">
                <audio controls preload="none">
                    <source src="THE SMASHING PUMPKINS - BLACK STARS.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                
            </div>
        </div>

        <div class="faixa">
            <span class="numero">4º</span>
            <div class="info">
                <div class="musica">FAVORITE SONG</div>
                <div class="artista">— SUBLIME</div>
            </div>
            <div class="mini-player">
                <audio controls preload="none">
                    <source src="SUBLIME - FAVORITE SONG.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                
            </div>
        </div>

        <div class="faixa">
            <span class="numero">5º</span>
            <div class="info">
                <div class="musica">SPECTRAL EYES</div>
                <div class="artista">— BLONDIE</div>
            </div>
            <div class="mini-player">
                <audio controls preload="none">
                    <source src="BLONDIE - SPECTRAL EYES.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                
            </div>
        </div>

        <a href="index.html" class="voltar">← Voltar para a Página Inicial</a>
    </div>
</body>
</html>
